# The shared build script and dependency specifications are identical for all backends.
package:
  name: opencv-source-pthreads
  version: 4.13.0
source:
  - url: https://github.com/opencv/opencv/archive/refs/tags/4.13.0.tar.gz
    sha256: 1d40ca017ea51c533cf9fd5cbde5b5fe7ae248291ddf2af99d4c17cf8e13017d
  - path: ../build.sh
build:
  number: 0
  script:
    content: bash build.sh
    env:
      OPENCV_PARALLEL: pthreads
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake ==3.31.8
    - ninja
  host:
    - python 3.11.*
    - numpy ==2.2.6
    - libgomp
    - tbb 2022.*
    - tbb-devel 2022.*
  run:
    - python 3.11.*
    - numpy ==2.2.6
    - libgomp
    - tbb 2022.*
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Controlled OpenCV 4.13.0 image-processing build
